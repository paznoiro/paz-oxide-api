[package]
name = "oxide-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Lightweight HTTP API that extracts text and markdown from PDF, Office and OpenDocument files, with OCR for scanned PDFs and images (en, hi, ar)"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "oxide-api"
path = "src/main.rs"

[dependencies]
pdf_oxide    = "=0.3.78"
office_oxide = "=0.1.13"          # the version pdf_oxide resolves; one copy in the graph
axum         = { version = "0.8", features = ["multipart"] }
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }
tower        = { version = "0.5", features = ["util"] }
tower-http   = { version = "0.6", features = ["trace", "request-id", "sensitive-headers", "set-header", "util"] }
rayon        = "1"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
base64       = "0.22"
bytes        = "1"
http-body-util = "0.1"
zip          = { version = "8", default-features = false }
unicode-normalization = "0.1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics      = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
mimalloc     = { version = "0.1", default-features = false }   # global allocator; musl's is slow under threads
quick-xml    = "0.42"             # the version office_oxide uses; reads OpenDocument XML
# Image decoders (pure Rust). TIFF also comes in directly to walk multi-page
# files; JPEG 2000 is the decoder pdf_oxide already uses for JPX streams.
image        = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp", "gif", "bmp", "pnm", "tga"] }
tiff         = { version = "0.11", default-features = false }
hayro-jpeg2000 = { version = "0.4", default-features = false }

[dev-dependencies]
http-body = "1"
serde_yaml_ng = "0.10"

[features]
default = ["docs", "ocr"]
docs = []                                               # /docs (Scalar from CDN; no bytes in the image)
ocr  = ["pdf_oxide/ocr", "pdf_oxide/rendering"]   # off (--no-default-features) builds a native-only binary

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"        # LOAD-BEARING: catch_unwind in the worker pools

# Fast local iteration: optimise dependencies even in dev builds (the engines
# are very slow unoptimised), keep our own crate quick to rebuild. No
# debuginfo for dependencies: the OCR test binaries otherwise reach ~600 MB
# and parallel links can exhaust a Docker VM's memory.
[profile.dev.package."*"]
opt-level = 2
debug = false

# pdf_oxide 0.3.78 doesn't compile against office_oxide >= 0.1.12 (which we
# need for `office_oxide::limits`). scripts/vendor_pdf_oxide.sh fetches the
# sha256-pinned crate and applies a one-line fix from patches/.
[patch.crates-io]
pdf_oxide = { path = "vendor/pdf_oxide" }
