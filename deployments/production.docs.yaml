# oxide-api on the "docs" VPS: the same server, Caddy and `web` network as
# zap-infra/collabora/deployments/production.docs.yaml.
#
#   export OXIDE_API_API_KEY=...                           # see "Secrets" below
#   zd  deployments/production.docs.yaml --dry-run         # preview the plan
#   zbd deployments/production.docs.yaml --tag 0.1.1       # build amd64 + push + deploy
#   zd  deployments/production.docs.yaml --tag 0.1.1       # deploy an already pushed tag
#
# Secrets: OXIDE_API_API_KEY comes from the shell that runs zd (zd stops with
# an error when it is unset), so the key is never committed. To read it from
# Doppler instead, add:
#   doppler:
#     project: oxide-api
#     config: production
version: 1

zap:
  name: oxide-api
doppler:
  project: general
  config: s3_r2

deploy:
  ssh:
    host: 187.126.118.179
    user: zaporion
    port: 22
    key: /Users/dvpandian/daniel/zaporion/oraclecloud/ssh-key-2026-06-29.key
  remote_dir: /opt/oxide-api

docker:
  image: ${env.IMAGE_REPO}
  network: web

compose:
  file: docker-compose.yml

caddy:
  # Needs a DNS record pointing at 187.126.118.179 (like collabora.zaporion.com).
  domain: oxide-api.zaporion.com
  container: caddy
  sites_dir: /opt/caddy/sites
  site_template: deployments/caddy-sites/oxide-api.caddy

healthcheck:
  type: docker
  target: oxide-api

# Written to the compose .env (tmpfs on the server) and passed whole to the
# container, so any OXIDE_API_* setting from the README can be added here.
env:
  IMAGE_REPO: ghcr.io/paznoiro/paz-oxide-api
  IMAGE_TAG: 0.2.1
  OXIDE_API_API_KEY: ${OXIDE_API_API_KEY}
  OXIDE_API_OCR_TIMEOUT_SECS: "90"
