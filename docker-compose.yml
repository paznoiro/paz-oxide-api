# Server compose for oxide-api. Set IMAGE_TAG to a published GHCR version.
# The image is pulled from GHCR; nothing is built on the server.
# Local run without SSH or Caddy: ./scripts/local.sh (publishes :8080).
#
# Container settings come from .env, or the file selected by ZAP_ENV_FILE.
# IMAGE_REPO and IMAGE_TAG can be overridden in the shell.
services:
  oxide-api:
    image: ${IMAGE_REPO:-ghcr.io/paznoiro/paz-oxide-api}:${IMAGE_TAG:-latest}
    container_name: oxide-api
    restart: unless-stopped
    # SIGTERM fails /readyz and lets in-flight requests finish; an OCR request
    # ends by its 90 s deadline (OXIDE_API_OCR_TIMEOUT_SECS) at the latest.
    stop_grace_period: 95s

    # --- reap zombie processes (PID 1) ---
    init: true

    # OXIDE_API_* settings come from the env file. format: raw
    # stops compose from interpolating values, so a `$` in a secret survives.
    env_file:
      - path: ${ZAP_ENV_FILE:-.env}
        format: raw

    # Reached by Caddy as oxide-api:8080 on the `web` network; no host port.
    expose:
      - "8080"

    # The image's HEALTHCHECK (`oxide-api healthcheck`, GET /healthz) is used
    # as is; inspect the container health status after starting it.

    # --- log rotation (json-file driver) ---
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"

    # Measured in docs/performance.md: 224 MiB idle, under 1 GiB at peak with
    # 8 concurrent 32 MiB uploads. Collabora shares this 4-vCPU host (limit 2).
    deploy:
      resources:
        limits:
          cpus: 4
          memory: 3G
          pids: 256
        reservations:
          cpus: 0.25
          memory: 256M

    # --- security hardening (non-root, read-only application and models) ---
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Indra's selected page images are temporary and removed after inference.
    tmpfs:
      - /tmp

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    networks:
      - web

networks:
  web:
    name: web
    external: true
