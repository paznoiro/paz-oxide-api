openapi: 3.1.0
info:
  title: Oxide API
  version: 0.3.1
  summary: Text, markdown and structured PDF extraction, with OCR.
  description: |
    One HTTP API that extracts `text` and `markdown` from **PDF**, **Office** (DOCX, XLSX, PPTX,
    DOC, XLS, PPT), **OpenDocument** (ODT, ODS, ODP) and **image** files (PNG, JPEG, TIFF, WebP,
    GIF, BMP, JPEG 2000, PNM, TGA). The file type is detected from the content, so one route
    serves every format.

    PDF pages are classified one by one: pages with a usable text layer are extracted natively,
    and scanned or legacy-font pages go through OCR (English, Hindi, Arabic) in the same request.
    Images go straight to OCR, one page per TIFF page; EXIF orientation is honoured. HEIC, AVIF
    and JPEG XL are recognized but not supported.

    **Input.** Send the document as multipart (`file=<binary>`), as JSON
    (`{"file_base64": "..."}`), or as the raw request body. Parameters are top-level multipart
    parts, JSON keys, or query parameters; body parameters override query parameters. Parameters
    that don't apply to the detected document kind are ignored and listed in `ignored_params`.

    **Output.** JSON by default. `Accept: text/plain` (text endpoint) or `Accept: text/markdown`
    (markdown endpoint) returns the raw text, with metadata in `X-Oxide-*` headers.

    **Structured PDF.** `/v1/extract/document` returns page text and ordered, positioned blocks
    for digital, scanned and mixed PDFs. Native font details and OCR recognizer confidence are
    retained; unavailable confidence is null. This is input for downstream LLM schema mapping;
    the service does not call an LLM or accept a target JSON schema.

    **Fields.** `/v1/extract/fields` reads the document exactly as the text endpoint does, then
    runs a list of named regular-expression fields over that one text and returns each value (or
    `null`). Its `fields` (and `text`) are taken whole, the one exception to "never nested".

    **Limits.** 32 MiB request body (for JSON this counts the base64 text). 8 requests are
    processed at once per container; others wait up to 1 s for a slot, then get `429`.
    Native extraction has a 30 s deadline, requests that OCR any page 120 s, both measured from
    admission. A PDF or image that runs out of time returns the pages done so far with
    `incomplete: true`. Images are limited to 64 megapixels per page.

    Errors use RFC 9457 `application/problem+json`.
  license:
    name: MIT OR Apache-2.0
servers:
  - url: http://localhost:8080
security:
  - bearer: []
tags:
  - name: extract
    description: Text, markdown and document info
  - name: ops
    description: Health, readiness, version, metrics (unauthenticated)
paths:
  /v1/extract/text:
    post:
      tags: [extract]
      operationId: extractText
      summary: Extract plain text
      description: |
        Office and OpenDocument: the document's plain text. PDF: per-page native text, with OCR
        for pages that need it. Images: OCR text per page. Pages are joined with a blank line.
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/pages'
        - $ref: '#/components/parameters/ocr'
        - $ref: '#/components/parameters/lang'
        - $ref: '#/components/parameters/clean'
        - $ref: '#/components/parameters/filename'
      requestBody:
        $ref: '#/components/requestBodies/Document'
      responses:
        '200':
          description: Extracted text
          headers:
            X-Engine:
              $ref: '#/components/headers/X-Engine'
            Server-Timing:
              $ref: '#/components/headers/Server-Timing'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PdfExtraction'
                  - $ref: '#/components/schemas/OfficeExtraction'
                  - $ref: '#/components/schemas/ImageExtraction'
                discriminator:
                  propertyName: kind
                  mapping:
                    pdf: '#/components/schemas/PdfExtraction'
                    office: '#/components/schemas/OfficeExtraction'
                    image: '#/components/schemas/ImageExtraction'
            text/plain:
              schema:
                type: string
              description: Raw text; metadata in `X-Oxide-*` headers.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '408': { $ref: '#/components/responses/UploadTimeout' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/Busy' }
        '503': { $ref: '#/components/responses/Draining' }
  /v1/extract/document:
    post:
      tags: [extract]
      operationId: extractDocument
      summary: Extract structured PDF content for downstream schema mapping
      description: |
        PDF only; digital, scanned and mixed pages share the text endpoint's classification,
        language resolution, OCR workers, admission, limits and error handling. Always JSON,
        including with Accept: text/plain. No LLM calls or schema mapping are performed.

        Native pages use PDF-Oxide positioned spans in its Structure reading order (geometric
        column order with tagged table ordering where supported). OCR pages are rendered once
        and reuse the existing recognizers, preserving detected text regions and recognition
        confidence. Mixed pages retain native text, discard duplicate OCR regions using the
        text endpoint's line comparison, and sort the combined blocks geometrically.
        Reading order and heading roles are best effort; this is not table-cell reconstruction.

        All boxes use points in the visible page after CropBox clipping and Rotate, with origin
        at top-left, x right and y down. `page.text` is the blocks joined with newlines.
        `char_count` sums page text Unicode scalar counts. The text budget counts that text
        once, including separators, and can shorten the final block (its box still bounds the
        original region). Pages omitted by a deadline or budget are absent from pages_extracted.
        `incomplete` means deadline; `truncated` means budget. Empty pages remain present.

        Confidence is null for native text (including an existing scanner OCR layer) and when
        unavailable; it is never a general extraction quality score. For OCR it is the engine
        recognition score in [0,1], character-weighted when the existing recognizer splits a
        region into words. No synthetic page or document confidence is calculated.
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/pages'
        - $ref: '#/components/parameters/ocr'
        - $ref: '#/components/parameters/lang'
        - $ref: '#/components/parameters/clean'
        - $ref: '#/components/parameters/filename'
      requestBody:
        $ref: '#/components/requestBodies/Document'
      responses:
        '200':
          description: Structured pages; check incomplete, truncated and OCR availability before mapping.
          headers:
            X-Engine: { $ref: '#/components/headers/X-Engine' }
            Server-Timing: { $ref: '#/components/headers/Server-Timing' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentExtraction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '408': { $ref: '#/components/responses/UploadTimeout' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/Busy' }
        '503': { $ref: '#/components/responses/Draining' }
  /v1/extract/markdown:
    post:
      tags: [extract]
      operationId: extractMarkdown
      summary: Extract markdown
      description: |
        Office and OpenDocument: markdown rendering of the document structure (headings, lists,
        tables). PDF: per-page markdown with heading detection; OCR'd pages and images contribute
        their lines and paragraphs.
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/pages'
        - $ref: '#/components/parameters/ocr'
        - $ref: '#/components/parameters/lang'
        - $ref: '#/components/parameters/detect_headings'
        - $ref: '#/components/parameters/clean'
        - $ref: '#/components/parameters/filename'
      requestBody:
        $ref: '#/components/requestBodies/Document'
      responses:
        '200':
          description: Extracted markdown
          headers:
            X-Engine:
              $ref: '#/components/headers/X-Engine'
            Server-Timing:
              $ref: '#/components/headers/Server-Timing'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PdfExtraction'
                  - $ref: '#/components/schemas/OfficeExtraction'
                  - $ref: '#/components/schemas/ImageExtraction'
                discriminator:
                  propertyName: kind
                  mapping:
                    pdf: '#/components/schemas/PdfExtraction'
                    office: '#/components/schemas/OfficeExtraction'
                    image: '#/components/schemas/ImageExtraction'
            text/markdown:
              schema:
                type: string
              description: Raw markdown; metadata in `X-Oxide-*` headers.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '408': { $ref: '#/components/responses/UploadTimeout' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/Busy' }
        '503': { $ref: '#/components/responses/Draining' }
  /v1/extract/fields:
    post:
      tags: [extract]
      operationId: extractFields
      summary: Extract named fields
      description: |
        Reads the document to its final text exactly as `/v1/extract/text` does (native text, OCR
        where pages need it, Arabic presentation forms normalized, `clean` when asked), then runs
        every field in `fields` over that one text: no field causes OCR of its own. Send `text`
        instead of a document to run the fields over text you already have (from an earlier
        extraction, say) without reading anything again.

        Each field's patterns are tried in order; the first **valid** match wins. A match is valid
        when its capture group took part, is not blank, reads as the field's `type`, and fits
        `max_length`; an invalid match is skipped, never cut down. With `multiple`, every valid
        match of every pattern is kept in that order, each distinct value once (at most 1000).
        Values are the text as read, trimmed, or for a typed field in its type's form (a date
        `YYYY-MM-DD`, an amount a plain decimal): nothing is corrected. `matched` holds what each
        value was read from, as printed, for marking it in the text.

        Every requested field is in the response: its value, an array (`multiple`), or `null` when
        nothing matched — never left out, unlike the optional keys of the other responses.
        Required fields that matched nothing are also listed in `missing_required`; the request
        still succeeds.

        Patterns are Rust `regex` syntax, matched in time linear in the text: inline flags such as
        `(?i)` (case), `(?m)` (`^`/`$` per line) and `(?s)` (`.` crosses lines) work; look-around
        and backreferences do not and are refused with the engine's reason. `\d`, `\w` and
        `(?i)` are Unicode-aware, so `\d` also matches Arabic-Indic and Devanagari digits. A
        value on the line after its label is reached with `\s+` (`Label\s+([^\n]+)`).

        Specs are checked before the document is read, so a bad pattern costs a `400` and no OCR.
        A request holds at most 50 fields and 100 patterns of at most 1000 characters each.
        Counted repetitions of broad classes compile large (`\w{1,200}` is ~10 MiB, the most one
        pattern may take; `[A-Za-z0-9]{1,200}` a fraction of that); the larger patterns of one
        request share a 40 MiB budget.

        Matching has a deadline of its own, the 30 s native deadline started afresh once the text
        is read, because OCR may have used the request's. So a request that OCRs can run past the
        120 s OCR deadline by that much; matching is linear in the text and normally takes
        milliseconds.

        Always JSON: `Accept` is not negotiated.
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/pages'
        - $ref: '#/components/parameters/ocr'
        - $ref: '#/components/parameters/lang'
        - $ref: '#/components/parameters/clean'
        - $ref: '#/components/parameters/include_text'
        - $ref: '#/components/parameters/filename'
      requestBody:
        $ref: '#/components/requestBodies/FieldsInput'
      responses:
        '200':
          description: The fields' values
          headers:
            X-Engine:
              $ref: '#/components/headers/X-Engine'
            Server-Timing:
              $ref: '#/components/headers/Server-Timing'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldsExtraction' }
              example:
                kind: pdf
                format: pdf
                format_source: sniff
                fields: { invoice_number: '4471', total: '1250.00', invoice_date: '2026-10-14' }
                matched: { invoice_number: '4471', total: '1,250.00', invoice_date: '14 Oct 2026' }
                missing_required: []
                char_count: 104
                truncated: false
                page_count: 1
                pages_extracted: [1]
                incomplete: false
                ocr: { status: ocr, lang: en, lang_source: probe, pages: [1], pages_needing_ocr: [], failed_pages: [], reasons: [{ page: 1, reason: scanned }] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '408': { $ref: '#/components/responses/UploadTimeout' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/Busy' }
        '503': { $ref: '#/components/responses/Draining' }
  /v1/info:
    post:
      tags: [extract]
      operationId: documentInfo
      summary: Document format, metadata and structure
      description: |
        Office and OpenDocument: format, core metadata, and structure (sheet names and
        dimensions, slide count, section count). PDF: metadata, page count, encryption flag and
        per-page geometry. Images: page count and pixel dimensions, read from the headers only.
      parameters:
        - $ref: '#/components/parameters/format'
        - $ref: '#/components/parameters/filename'
      requestBody:
        $ref: '#/components/requestBodies/Document'
      responses:
        '200':
          description: Document info
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PdfInfo'
                  - $ref: '#/components/schemas/OfficeInfo'
                  - $ref: '#/components/schemas/ImageInfo'
                discriminator:
                  propertyName: kind
                  mapping:
                    pdf: '#/components/schemas/PdfInfo'
                    office: '#/components/schemas/OfficeInfo'
                    image: '#/components/schemas/ImageInfo'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '408': { $ref: '#/components/responses/UploadTimeout' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/Busy' }
        '503': { $ref: '#/components/responses/Draining' }
  /healthz:
    get:
      tags: [ops]
      operationId: healthz
      summary: Liveness
      description: Fails (503) only when the watchdog sees a job running longer than 10x its deadline.
      security: []
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '503':
          description: Unhealthy; restart the container
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
  /readyz:
    get:
      tags: [ops]
      operationId: readyz
      summary: Readiness
      description: Ready once startup (including OCR model loading and golden smoke tests) is done; 503 while starting or draining.
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '503':
          description: Not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
  /version:
    get:
      tags: [ops]
      operationId: version
      summary: Build, engine versions, limits and OCR status
      security: []
      responses:
        '200':
          description: Version info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }
  /metrics:
    get:
      tags: [ops]
      operationId: metrics
      summary: Prometheus metrics
      security: []
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
  /openapi.json:
    get:
      tags: [ops]
      operationId: openapiJson
      summary: This contract as JSON
      security: []
      responses:
        '200':
          description: OpenAPI document
          content:
            application/json:
              schema:
                type: object
  /openapi.yaml:
    get:
      tags: [ops]
      operationId: openapiYaml
      summary: This contract as YAML
      security: []
      responses:
        '200':
          description: OpenAPI document
          content:
            application/yaml:
              schema:
                type: string
  /docs:
    get:
      tags: [ops]
      operationId: docs
      summary: Interactive API reference (Scalar, loaded from a CDN)
      security: []
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The value of `OXIDE_API_API_KEY`.
  parameters:
    format:
      name: format
      in: query
      required: false
      description: |
        Format hint, used only when the content itself is inconclusive (the content sniff always
        wins). Aliases are accepted too: template and macro-enabled extensions (`dotx`, `xlsm`,
        `ott`, ...), `jpg`, `tif`, `pbm`/`pgm`/`ppm`, `j2k`. TGA has no signature, so a TGA needs
        this hint or a `.tga` filename.
      schema:
        type: string
        enum: [pdf, docx, xlsx, pptx, doc, xls, ppt, odt, ods, odp, png, jpeg, tiff, webp, gif, bmp, jp2, pnm, tga]
    pages:
      name: pages
      in: query
      required: false
      description: 'PDF and images (TIFF pages). 1-based pages and ranges, e.g. `1-3,5`.'
      schema:
        type: string
        example: 1-3,5
    ocr:
      name: ocr
      in: query
      required: false
      description: |
        PDF and images. PDF: `auto` OCRs pages classified as scanned, hybrid or set in a legacy
        Hindi font; `force` OCRs every requested page; `off` skips classification. Images are
        always OCR'd unless `off`.
      schema:
        type: string
        enum: [auto, force, 'off']
        default: auto
    lang:
      name: lang
      in: query
      required: false
      description: |
        PDF and images. OCR language. `auto` resolves once per document: legacy Hindi font →
        `hi`; else the native text's script; else a confidence probe on the first OCR page; else
        `en`.
      schema:
        type: string
        enum: [auto, en, hi, ar]
        default: auto
    detect_headings:
      name: detect_headings
      in: query
      required: false
      description: PDF markdown only. Detect headings from font size and weight.
      schema:
        type: boolean
        default: true
    clean:
      name: clean
      in: query
      required: false
      description: |
        Any document. When `true`, extra whitespace is collapsed: runs of spaces and tabs
        become a single space, trailing whitespace on each line is removed, 3+ newlines
        become a single blank line, and leading/trailing blank lines are trimmed.
        Markdown code-block indentation is collapsed to a single space.
      schema:
        type: boolean
        default: false
    include_text:
      name: include_text
      in: query
      required: false
      description: |
        `/v1/extract/fields` only. Also return the text the fields ran over, so a caller that
        indexes the text and wants fields gets both from one read of the document.
      schema:
        type: boolean
        default: false
    filename:
      name: filename
      in: query
      required: false
      description: Original filename; its extension is the last-resort format hint (after the content and `format`).
      schema:
        type: string
  requestBodies:
    Document:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
                description: The document.
              format: { type: string }
              pages: { type: string }
              ocr: { type: string }
              lang: { type: string }
              detect_headings: { type: string }
              clean: { type: string }
        application/json:
          schema:
            type: object
            required: [file_base64]
            properties:
              file_base64:
                type: string
                description: Base64 (standard or URL-safe; a `data:` URI prefix is accepted).
              format: { type: string }
              pages: { type: string }
              ocr: { type: string }
              lang: { type: string }
              detect_headings: { type: boolean }
              clean: { type: boolean }
              filename: { type: string }
            additionalProperties:
              description: Parameters are top-level scalars, never nested.
        application/octet-stream:
          schema:
            type: string
            format: binary
          description: Any other content type is treated as the raw document.
    FieldsInput:
      required: true
      description: |
        A document, as for the other endpoints, or `text` — not both — plus `fields`. In a JSON
        body `fields` is the array itself; as a multipart part or query parameter it is that array
        as a JSON string. A raw body can carry it only in the query string (4096 characters), so
        send JSON or multipart for anything longer.
      content:
        application/json:
          schema:
            type: object
            required: [fields]
            properties:
              fields:
                type: array
                minItems: 1
                maxItems: 50
                items: { $ref: '#/components/schemas/FieldSpec' }
              file_base64:
                type: string
                description: The document, base64 (standard or URL-safe; a `data:` URI prefix is accepted).
              text:
                type: string
                description: Text to run the fields over instead of a document.
              format: { type: string }
              pages: { type: string }
              ocr: { type: string }
              lang: { type: string }
              clean: { type: boolean }
              include_text: { type: boolean }
              filename: { type: string }
          example:
            file_base64: JVBERi0xLjcK...
            fields:
              - name: invoice_number
                patterns: ['(?i)invoice\s*(?:no|number|#)?[:.]?\s*([A-Z0-9 _./-]+)']
                required: true
                max_length: 40
              - name: total
                patterns: ['(?i)total amount due:\s*([\d,]+\.\d{2})', '(?i)total\s+([\d,]+\.\d{2})']
                type: amount
              - name: invoice_date
                patterns: ['(?i)invoice date:?\s*([^\n]+)']
                type: date
        multipart/form-data:
          schema:
            type: object
            required: [fields]
            properties:
              file:
                type: string
                format: binary
                description: The document.
              fields:
                type: string
                description: The field specs as a JSON array.
              text:
                type: string
                description: Text to run the fields over instead of `file`.
              format: { type: string }
              pages: { type: string }
              ocr: { type: string }
              lang: { type: string }
              clean: { type: string }
              include_text: { type: string }
        application/octet-stream:
          schema:
            type: string
            format: binary
          description: The raw document, with `fields` in the query string.
  headers:
    X-Engine:
      description: |
        Engine and version: `pdf_oxide/0.3.78` (PDFs, and image OCR), `office_oxide/0.1.13`
        (DOCX/XLSX/PPTX/DOC/XLS/PPT) or `oxide-api/0.3.1` (OpenDocument, image info).
      schema: { type: string }
    Server-Timing:
      description: '`queue`, `parse`, `extract` and (when OCR ran) `ocr` durations in ms.'
      schema: { type: string }
  responses:
    BadRequest:
      description: Malformed input or an invalid parameter (the problem names the accepted values).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or wrong bearer token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UploadTimeout:
      description: The request body took longer than 30 s to arrive.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooLarge:
      description: The request body is over the 32 MiB limit.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: |
        Unsupported, corrupt or encrypted document (`encrypted-document`, `corrupt-document`,
        `unsupported-format`, `too-many-pages`, `image-too-large`), a processing timeout
        (`processing-timeout`), or every page's OCR failing with `ocr=force` or on an image
        (`ocr-failed`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Busy:
      description: No processing slot became free within 1 s. Honour `Retry-After`.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Draining:
      description: The instance is shutting down.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    FormatSource:
      type: string
      enum: [sniff, param, filename]
      description: How the format was determined.
    DocumentExtraction:
      type: object
      required: [schema_version, kind, format, format_source, coordinate_system, char_count, truncated, page_count, pages_extracted, incomplete, ocr, pages]
      properties:
        schema_version: { type: string, const: '1.0' }
        kind: { type: string, const: pdf }
        format: { type: string, const: pdf }
        format_source: { $ref: '#/components/schemas/FormatSource' }
        coordinate_system:
          type: object
          required: [unit, origin, x_direction, y_direction]
          properties:
            unit: { type: string, const: pt }
            origin: { type: string, const: top_left }
            x_direction: { type: string, const: right }
            y_direction: { type: string, const: down }
        char_count: { type: integer, minimum: 0, description: Sum of Unicode scalar values in page text. }
        truncated: { type: boolean }
        page_count: { type: integer, minimum: 0 }
        pages_extracted:
          type: array
          items: { type: integer, minimum: 1 }
        incomplete: { type: boolean }
        ocr: { $ref: '#/components/schemas/OcrInfo' }
        failed_pages:
          type: array
          items: { type: integer, minimum: 1 }
        pages:
          type: array
          items: { $ref: '#/components/schemas/DocumentPage' }
        ignored_params:
          type: array
          items: { type: string }
    DocumentPage:
      type: object
      required: [page, width, height, rotation, text, blocks, truncated]
      properties:
        page: { type: integer, minimum: 1, description: Original 1-based page number. }
        width: { type: number, exclusiveMinimum: 0, description: Visible rotated page width in points. }
        height: { type: number, exclusiveMinimum: 0, description: Visible rotated page height in points. }
        rotation: { type: integer, description: Original page rotation in degrees, already applied to boxes. }
        text: { type: string, description: Ordered block text joined with newlines. }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/DocumentBlock' }
        truncated: { type: boolean, description: This page lost text to the document budget. }
    DocumentBlock:
      type: object
      required: [id, reading_order, kind, text, bbox, source, confidence]
      properties:
        id: { type: string, description: 'Page-scoped citation ID, e.g. p1-b0; deterministic for the same extraction, not a persistent document ID.' }
        reading_order: { type: integer, minimum: 0, description: Zero-based position in this page's blocks array. }
        kind: { type: string, enum: [text, heading, header, footer, page_number, artifact] }
        text: { type: string }
        bbox:
          oneOf:
            - $ref: '#/components/schemas/DocumentBox'
            - type: 'null'
          description: Axis-aligned region in displayed page points; null when source geometry is unavailable.
        source: { type: string, enum: [native, ocr] }
        confidence:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: OCR recognition confidence only; null for native text or unavailable scores. Word-split regions use character-weighted engine scores.
        heading_level: { type: integer, minimum: 1, maximum: 6 }
        font:
          type: object
          required: [name, size, bold, italic]
          properties:
            name: { type: string }
            size: { type: number, description: Native font size in PDF points. }
            bold: { type: boolean }
            italic: { type: boolean }
    DocumentBox:
      type: object
      required: [x, y, width, height]
      properties:
        x: { type: number, minimum: 0 }
        y: { type: number, minimum: 0 }
        width: { type: number, exclusiveMinimum: 0 }
        height: { type: number, exclusiveMinimum: 0 }
    PdfExtraction:
      type: object
      required: [kind, format, format_source, text, char_count, truncated, page_count, pages_extracted, incomplete, ocr]
      properties:
        kind: { type: string, const: pdf }
        format: { type: string, const: pdf }
        format_source: { $ref: '#/components/schemas/FormatSource' }
        text: { type: string }
        char_count: { type: integer, description: Unicode scalar values in `text`. }
        truncated: { type: boolean, description: The 4 Mi-character output budget ran out. }
        page_count: { type: integer }
        pages_extracted:
          type: array
          items: { type: integer }
          description: 1-based pages whose text is in `text`.
        incomplete:
          type: boolean
          description: The deadline passed; request the missing pages with `pages=`.
        ocr: { $ref: '#/components/schemas/OcrInfo' }
        failed_pages:
          type: array
          items: { type: integer }
          description: Pages whose native text could not be extracted (omitted when empty).
        ignored_params:
          type: array
          items: { type: string }
          description: Parameters that don't apply to this document (omitted when empty).
    OcrInfo:
      type: object
      required: [status, pages, pages_needing_ocr, failed_pages]
      properties:
        status:
          type: string
          enum: [native, ocr, hybrid, unavailable, 'off']
          description: |
            `native`: no page needed OCR. `ocr`: every page came from OCR. `hybrid`: a mix, or
            native text plus OCR lines. `unavailable`: OCR was needed but isn't available here
            (models not loaded, or the language isn't available). `off`: `ocr=off`.
        lang:
          type: string
          enum: [en, hi, ar]
        lang_source:
          type: string
          enum: [param, font, text, probe, default]
        pages:
          type: array
          items: { type: integer }
          description: Pages whose output includes OCR text.
        pages_needing_ocr:
          type: array
          items: { type: integer }
          description: Pages that need OCR but didn't get it (OCR unavailable for them).
        failed_pages:
          type: array
          items: { type: integer }
          description: Pages whose OCR failed; they carry native text, or none when the page's OCR layer was junk.
        reasons:
          type: array
          description: Why each page was routed to OCR (omitted when none was).
          items:
            type: object
            required: [page, reason]
            properties:
              page: { type: integer }
              reason:
                type: string
                enum: [scanned, hybrid, legacy_font, forced, image]
    OfficeExtraction:
      type: object
      required: [kind, format, format_source, text, char_count, truncated]
      properties:
        kind: { type: string, const: office }
        format:
          type: string
          enum: [docx, xlsx, pptx, doc, xls, ppt, odt, ods, odp]
        format_source: { $ref: '#/components/schemas/FormatSource' }
        text: { type: string }
        char_count: { type: integer }
        truncated: { type: boolean }
        ignored_params:
          type: array
          items: { type: string }
    ImageExtraction:
      type: object
      description: Same shape as a PDF extraction; every page comes from OCR.
      required: [kind, format, format_source, text, char_count, truncated, page_count, pages_extracted, incomplete, ocr]
      properties:
        kind: { type: string, const: image }
        format:
          type: string
          enum: [png, jpeg, tiff, webp, gif, bmp, jp2, pnm, tga]
        format_source: { $ref: '#/components/schemas/FormatSource' }
        text: { type: string }
        char_count: { type: integer }
        truncated: { type: boolean }
        page_count: { type: integer, description: TIFF pages; 1 for other formats. }
        pages_extracted:
          type: array
          items: { type: integer }
        incomplete: { type: boolean }
        ocr: { $ref: '#/components/schemas/OcrInfo' }
        failed_pages:
          type: array
          items: { type: integer }
        ignored_params:
          type: array
          items: { type: string }
    PdfInfo:
      type: object
      required: [kind, format, format_source, version, page_count, encrypted, metadata, pages]
      properties:
        kind: { type: string, const: pdf }
        format: { type: string, const: pdf }
        format_source: { $ref: '#/components/schemas/FormatSource' }
        version: { type: string, example: '1.7' }
        page_count: { type: integer }
        encrypted: { type: boolean }
        metadata:
          type: object
          properties:
            title: { type: string }
            author: { type: string }
            subject: { type: string }
            keywords: { type: string }
            creator: { type: string }
            producer: { type: string }
            created: { type: string }
            modified: { type: string }
        pages:
          type: array
          items:
            type: object
            required: [page, width, height, rotation]
            properties:
              page: { type: integer }
              width: { type: number, description: Points. }
              height: { type: number, description: Points. }
              rotation: { type: integer, enum: [0, 90, 180, 270] }
        ignored_params:
          type: array
          items: { type: string }
    OfficeInfo:
      type: object
      required: [kind, format, format_source, metadata]
      properties:
        kind: { type: string, const: office }
        format:
          type: string
          enum: [docx, xlsx, pptx, doc, xls, ppt, odt, ods, odp]
        format_source: { $ref: '#/components/schemas/FormatSource' }
        metadata:
          type: object
          description: Core properties (title, author, created, modified, ...).
        sheets:
          type: array
          description: Spreadsheets only.
          items:
            type: object
            required: [name, rows, cols]
            properties:
              name: { type: string }
              rows: { type: integer }
              cols: { type: integer }
        slide_count:
          type: integer
          description: Presentations only.
        section_count:
          type: integer
          description: Word-processing documents only.
        ignored_params:
          type: array
          items: { type: string }
    ImageInfo:
      type: object
      required: [kind, format, format_source, page_count, pages]
      properties:
        kind: { type: string, const: image }
        format:
          type: string
          enum: [png, jpeg, tiff, webp, gif, bmp, jp2, pnm, tga]
        format_source: { $ref: '#/components/schemas/FormatSource' }
        page_count: { type: integer }
        pages:
          type: array
          items:
            type: object
            required: [page, width, height]
            properties:
              page: { type: integer }
              width: { type: integer, description: Pixels, as stored (before EXIF orientation). }
              height: { type: integer, description: Pixels, as stored. }
        ignored_params:
          type: array
          items: { type: string }
    FieldSpec:
      type: object
      required: [name, patterns]
      additionalProperties: false
      description: One named value to read out of the text. Unknown keys are refused.
      properties:
        name:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
          description: The key of the value in `fields`; unique within the request.
          example: invoice_number
        patterns:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 1000 }
          description: Regular expressions (Rust `regex` syntax), tried in order.
        capture_group:
          oneOf:
            - type: integer
              minimum: 0
            - type: string
          description: |
            The group that is the value: a number (`0` is the whole match) or a group name
            (`(?<name>...)`). It must exist in every pattern. Omitted: group 1 for a pattern that
            has one, the whole match for a pattern that has none.
        required:
          type: boolean
          default: false
          description: A required field that matches nothing is listed in `missing_required`.
        type:
          type: string
          enum: [text, date, amount, gstin, pan, iban]
          default: text
          description: |
            What the value must be. A match that does not read as its type is not a valid match:
            the next one is tried. The value is written in one form whatever the print, and
            nothing is corrected (an `O` read for a `0` fails the check):

            - `date`: `YYYY-MM-DD`. Numeric (`14/10/2026`, `14.10.26`, `2026-10-14`) or with an
              English month name (`14 Oct 2026`, `14th October, 2026`, `Oct 14, 2026`, `Wed, 14 Oct 2026`);
              a day the month does not have is not a date. A two-digit year below 70 is 20xx, else 19xx.
            - `amount`: a plain decimal, `-` when negative (`-`, a trailing `-`, or brackets).
              A sign and currency around the number are allowed (`Rs.`, `₹`, `USD`, `US$`, `1,250/-`,
              `1 250,00 €`); digits grouped in threes or Indian style (`1,25,000`), one separator kind.
              Decimal digits are kept as printed, never rounded: `₹ 1,25,000.50` → `125000.50`.
            - `gstin`: 15 characters, upper-case, spaces and hyphens removed; the check character must match.
            - `pan`: `AAAAA9999A`, upper-case; the shape only.
            - `iban`: upper-case without spaces; the ISO 13616 mod-97 check must pass.

            A capture over 64 characters is never a typed value.
          example: date
        format:
          type: string
          enum: [dmy, mdy, ymd, point, comma]
          description: |
            `date`: how an all-numeric date is read, `dmy` (default), `mdy` or `ymd`; four digits
            first is always year-month-day. `amount`: the decimal mark, `point` (default,
            `1,250.00`) or `comma` (`1.250,00`). Refused for other types.
        normalization:
          type: string
          enum: [trim, none]
          default: trim
          description: |
            `trim` removes leading and trailing whitespace; `none` keeps the capture as matched.
            A `text` field's only: a typed value is always written in its type's form.
        max_length:
          type: integer
          minimum: 1
          maximum: 10000
          description: A longer value is not a valid match; the next one is tried. Characters of the value as returned.
        multiple:
          type: boolean
          default: false
          description: Return every distinct valid match, in order, as an array.
        selection:
          type: string
          enum: [first]
          default: first
          description: Which valid match is the value. Only `first` today.
    FieldsExtraction:
      type: object
      required: [kind, fields, matched, missing_required, char_count, truncated]
      description: |
        `kind` is the document's, or `text` when `text` was sent; a PDF or image adds the same
        page and OCR details as its text extraction.
      properties:
        kind:
          type: string
          enum: [pdf, office, image, text]
        format:
          type: string
          description: As in the text extraction; absent for `text`.
        format_source: { $ref: '#/components/schemas/FormatSource' }
        fields:
          type: object
          description: Every requested field, in request order.
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items: { type: string }
              - type: 'null'
        matched:
          type: object
          description: |
            What each value was read from, as printed, keyed like `fields`: the text to look for
            when marking a value, since a typed value (`2026-10-14`) is not in the text and its
            print (`14 Oct 2026`) is. A `multiple` field lists every distinct print of the values
            kept; `null` where nothing matched.
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items: { type: string }
              - type: 'null'
        missing_required:
          type: array
          items: { type: string }
          description: Required fields that matched nothing, in request order.
        char_count: { type: integer, description: Unicode scalar values in the text the fields ran over. }
        truncated: { type: boolean, description: 'The 4 Mi-character budget ran out: later text was never searched.' }
        page_count: { type: integer }
        pages_extracted:
          type: array
          items: { type: integer }
        incomplete:
          type: boolean
          description: The deadline passed before every page was read; values on the missing pages were not seen.
        ocr: { $ref: '#/components/schemas/OcrInfo' }
        failed_pages:
          type: array
          items: { type: integer }
        text:
          type: string
          description: The text the fields ran over (`include_text` only).
        ignored_params:
          type: array
          items: { type: string }
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, detail]
      properties:
        type: { type: string, example: /problems/encrypted-document }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        parameter:
          type: string
          description: The offending parameter (400 only); for a field spec, its place, e.g. `fields[1].patterns[0]`.
        accepted: { type: string, description: Accepted values (400 only). }
        limit_pixels: { type: integer, description: The per-page pixel limit (`image-too-large` only). }
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string }
        reason: { type: string }
    Version:
      type: object
      required: [name, version, engines, limits, ocr]
      properties:
        name: { type: string }
        version: { type: string }
        engines:
          type: object
          properties:
            pdf_oxide: { type: string }
            office_oxide: { type: string }
        uptime_secs: { type: integer }
        limits: { type: object }
        auth: { type: boolean }
        ocr:
          type: object
          description: OCR status; per-language `available` or `{status, reason}`.
