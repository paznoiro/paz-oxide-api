name: release-docker
run-name: Build and publish main (${{ github.sha }})

on:
  push:
    branches: [main]
  workflow_dispatch:

# Keep every push queued, including pushes arriving while another is pending.
# Serialize version allocation and publication so latest cannot move backwards.
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ghcr-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Reserve next patch version (reuse on retry)
        id: version
        run: python3 scripts/release_version.py --reserve

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  docker:
    needs: [version, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp binary and OpenAPI version
        run: python3 scripts/release_version.py --set "$VERSION"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build amd64 image for smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: oxide-api:ci
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
      - name: Smoke test image before publishing
        env:
          OXIDE_API_API_KEY: ci-key-0123456789abcdef
        run: |
          docker run -d --name oxide -p 8080:8080 -e OXIDE_API_API_KEY oxide-api:ci
          ./scripts/smoke.sh
          curl -fsS http://localhost:8080/version | python3 -c 'import json,os,sys; assert json.load(sys.stdin)["version"] == os.environ["VERSION"]'
      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Published image
        run: |
          {
            echo "### Published to GHCR"
            echo "Version: \`$VERSION\`"
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo "\`docker pull $IMAGE:$VERSION\`"
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Container logs
        if: failure()
        run: docker logs oxide 2>&1 || true
