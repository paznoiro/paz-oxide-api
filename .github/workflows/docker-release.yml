# Release → multi-arch image on GHCR.
#
# Whenever a GitHub Release is published (e.g. `gh release create v0.1.0`),
# this builds linux/amd64 + linux/arm64 and pushes to GHCR, then appends the
# `docker pull` commands + package link to the release body ("binaries").
#
# All RUN stages of the Dockerfile execute on $BUILDPLATFORM and only the
# final stage is per-arch (COPY-only), so one ubuntu runner cross-compiles
# both arches with no emulation and no ARM runner needed.
#
# Tags for release vX.Y.Z (non-prerelease): X.Y.Z, X.Y, X, latest.
# Prereleases get X.Y.Z only (no `latest` float).
name: release-docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0 (manual re-run only)"
        required: false
        type: string

permissions:
  contents: write      # append GHCR pull info to the release body
  packages: write      # push to ghcr.io
  id-token: write      # keyless provenance attestation
  attestations: write  # actions/attest-build-provenance

env:
  CARGO_TERM_COLOR: always

jobs:
  docker:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          v="${ref#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version: $v (from ref: $ref)"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/paz-oxide-api
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=sha,prefix=,suffix=-${{ github.ref_name }},format=short
          labels: |
            org.opencontainers.image.title=oxide-api
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/paz-oxide-api
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release-notes:
    # Manual re-runs (workflow_dispatch) only rebuild the image; release notes
    # are touched solely for real published releases (avoids creating a
    # release as a side effect when none exists for the tag).
    if: github.event_name == 'release'
    needs: [docker]
    runs-on: ubuntu-24.04
    steps:
      - name: Append GHCR pull info to the release body
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          append_body: true
          body: |
            ## Container image (GHCR)

            Multi-arch (`linux/amd64`, `linux/arm64`), published by the `release-docker` workflow:

            ```sh
            docker pull ghcr.io/${{ github.repository_owner }}/paz-oxide-api:${{ needs.docker.outputs.version }}
            docker run -p 8080:8080 -e OXIDE_API_API_KEY=<your-key> --read-only ghcr.io/${{ github.repository_owner }}/paz-oxide-api:${{ needs.docker.outputs.version }}
            ```

            Also tagged `:latest` (stable releases only).
            Package page: ${{ github.server_url }}/${{ github.repository }}/pkgs/container/paz-oxide-api
