# CI + release for oxide-api (PLAN.md §7). Not yet exercised on GitHub.
name: ci

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/paz-oxide-api

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: ./scripts/vendor_pdf_oxide.sh
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --no-default-features
      - name: Full tests incl. OCR (ONNX Runtime + models, sha256-pinned)
        run: |
          ./scripts/fetch_ocr_models.sh target/ocr-assets/models
          curl -fsSL -o /tmp/ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.28.3/onnxruntime-linux-x64-1.28.3.tgz
          echo "db14e4863bd37893fc59729d986ab2a0d043d10b7d44da1913c4982b7e3d009c  /tmp/ort.tgz" | sha256sum -c -
          mkdir -p target/ocr-assets/ort && tar -xzf /tmp/ort.tgz -C target/ocr-assets/ort --strip-components=1
          ORT_DYLIB_PATH=$PWD/target/ocr-assets/ort/lib/libonnxruntime.so \
          OXIDE_API_OCR_MODEL_DIR=$PWD/target/ocr-assets/models \
            cargo test

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - run: ./scripts/vendor_pdf_oxide.sh
      - run: cargo check --all-targets && cargo check --all-targets --no-default-features

  image:
    needs: [test]
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux/amd64, arch: amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: docker buildx build --platform ${{ matrix.platform }} --load -t oxide-api:ci .
      - name: Size budget (< 70 MB compressed)
        run: |
          size=$(docker save oxide-api:ci | gzip | wc -c)
          echo "image (gzip): $size bytes"
          test "$size" -lt 70000000
      - name: End-to-end smoke test
        run: |
          docker run -d --name oxide -p 8080:8080 -e OXIDE_API_API_KEY=ci-key-0123456789abcdef oxide-api:ci
          OXIDE_API_API_KEY=ci-key-0123456789abcdef ./scripts/smoke.sh
      - name: Push by digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=${GITHUB_REF_NAME#v}
          docker tag oxide-api:ci $IMAGE:$v-${{ matrix.arch }}
          docker push $IMAGE:$v-${{ matrix.arch }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch manifests, signatures, SBOM attestations
        run: |
          v=${GITHUB_REF_NAME#v}
          for tag in $v latest; do
            docker buildx imagetools create -t $IMAGE:$tag $IMAGE:$v-amd64 $IMAGE:$v-arm64
          done
          digest=$(docker buildx imagetools inspect $IMAGE:$v --format '{{json .Manifest.Digest}}' | tr -d '"')
          cosign sign --yes $IMAGE@$digest
          syft $IMAGE@$digest -o spdx-json > sbom.spdx.json
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json $IMAGE@$digest
