name: ci

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: ./scripts/vendor_pdf_oxide.sh
      - uses: Swatinem/rust-cache@v2
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked --no-default-features
      - name: Full tests including OCR
        run: |
          ./scripts/fetch_ocr_models.sh target/ocr-assets/models
          curl -fsSL --retry 3 -o /tmp/ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.28.3/onnxruntime-linux-x64-1.28.3.tgz
          echo "db14e4863bd37893fc59729d986ab2a0d043d10b7d44da1913c4982b7e3d009c  /tmp/ort.tgz" | sha256sum -c -
          mkdir -p target/ocr-assets/ort
          tar -xzf /tmp/ort.tgz -C target/ocr-assets/ort --strip-components=1
          ORT_DYLIB_PATH=$PWD/target/ocr-assets/ort/lib/libonnxruntime.so \
          OXIDE_API_OCR_MODEL_DIR=$PWD/target/ocr-assets/models \
            cargo test --locked

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - run: ./scripts/vendor_pdf_oxide.sh
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --locked --all-targets
      - run: cargo check --locked --all-targets --no-default-features
